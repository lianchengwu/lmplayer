name: Build

on:
  push:
    branches: [main, rust]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK4 / WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build wmplayer
        run: cargo build --release --bin wmplayer

      - name: Test kugou
        run: cargo test --manifest-path kugou/Cargo.toml

      - name: Package
        run: |
          mkdir -p bin
          cp target/release/wmplayer bin/wmplayer
          tar -C bin -czvf wmplayer-linux-amd64.tar.gz wmplayer

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmplayer-linux-amd64
          path: wmplayer-linux-amd64.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build wmplayer
        run: cargo build --release --bin wmplayer

      - name: Test kugou
        run: cargo test --manifest-path kugou/Cargo.toml

      - name: Package Windows
        shell: bash
        run: |
          mkdir -p bin
          cp target/release/wmplayer.exe bin/
          7z a -tzip wmplayer-windows-amd64.zip ./bin/wmplayer.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmplayer-windows-amd64
          path: wmplayer-windows-amd64.zip

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build wmplayer
        run: cargo build --release --bin wmplayer

      - name: Test kugou
        run: cargo test --manifest-path kugou/Cargo.toml

      - name: Package macOS
        run: |
          mkdir -p bin
          cp target/release/wmplayer bin/wmplayer
          chmod +x bin/wmplayer
          zip -j wmplayer-darwin-universal.zip bin/wmplayer

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmplayer-darwin-universal
          path: wmplayer-darwin-universal.zip
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
