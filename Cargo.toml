[package]
name = "wmplayer"
version = "0.9.4"
edition = "2021"
description = "wmPlayer Rust backend — KuGou via kugou crate, Lite default"
autobins = false

[[bin]]
name = "wmplayer"
path = "src/bin/wmplayer.rs"

[dependencies]
kugou = { path = "kugou" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "6"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = "8"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
lofty = "0.25.2"
rfd = "0.17.2"
walkdir = "2"
md5 = "0.7"
tower-service = "0.3"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.9"
webkit6 = "0.4"
ksni = { version = "0.3", features = ["blocking"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
tao = "0.37"
wry = "0.57"
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
] }
windows-numerics = "0.3"
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
